# Configuración del editor (Pages CMS): https://app.pagescms.org
# Define qué se puede editar en la web y cómo se ve el formulario.

media:
  input: public/media
  output: /media
  rename: safe

settings:
  commit:
    identity: user

content:
  - name: planes
    label: Planes
    type: collection
    path: src/content/planes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: nombre
      fields: [nombre, fecha, publicado]
      sort: [fecha, nombre]
      default:
        sort: fecha
        order: desc
    fields:
      - name: nombre
        label: Nombre del plan
        type: string
        required: true
        description: "Por ejemplo: ¡Halloween!, Bollos a pie, Cata de vino."
      - name: publicado
        label: Mostrar en la web
        type: boolean
        default: true
        description: Desactívalo para esconder el plan sin borrarlo.
      - name: tipo
        label: Tipo de plan
        type: string
        description: "Opcional. Por ejemplo: Senderismo, Fiesta, Cata."
      - name: con
        label: Con (DJ, artista, invitada…)
        type: string
        description: "Opcional. Se muestra como «¡Halloween! con DJ Anabel»."
      - name: fecha
        label: Fecha
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: Déjala vacía si todavía no hay fecha. Saldrá como «Próximamente».
      - name: hora
        label: Hora de inicio
        type: string
        pattern:
          regex: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Escribe la hora así: 22:00"
        description: "Opcional. Formato 22:00."
      - name: fin
        label: Hora de cierre
        type: string
        pattern:
          regex: "^$|^([01][0-9]|2[0-3]):[0-5][0-9]$"
          message: "Escribe la hora así: 03:00"
        description: "Opcional. Formato 03:00."
      - name: lugar
        label: Sala o punto de encuentro
        type: string
        description: "Por ejemplo: Rufián."
      - name: direccion
        label: Dirección
        type: string
        description: "Calle, número, código postal y ciudad. Se convierte en un enlace a Google Maps."
      - name: entradas
        label: Enlace de entradas (Entradium)
        type: string
        pattern:
          regex: "^$|^https?://"
          message: "Pega el enlace completo, empezando por https://"
        description: "Pega el enlace del evento sin lo que va después del «?». Si está vacío, sale «Entradas pronto»."
      - name: cartel
        label: Cartel
        type: image
        description: Imagen vertical. Mejor en buena calidad (por ejemplo 900 × 1350).
      - name: video
        label: Vídeo
        type: file
        options:
          categories: [video]
        description: "Opcional. Sustituye al cartel en el plan destacado. MP4 vertical de menos de 10 MB."

  - name: sitio
    label: Datos de la web
    type: file
    path: src/data/sitio.json
    format: json
    operations:
      delete: false
    fields:
      - name: lema
        label: Lema
        type: string
        required: true
        description: La frase que aparece debajo del logo.
      - name: instagram
        label: Enlace de Instagram
        type: string
      - name: email
        label: Correo de contacto
        type: string
      - name: feedInstagram
        label: Feed de Instagram (Behold)
        type: string
        description: No lo cambies salvo que cambiéis de cuenta en Behold.
      - name: fotosInstagram
        label: Número de fotos de Instagram
        type: number
        options:
          min: 0
          max: 12
        description: "6 queda bien. Pon 0 para ocultar la sección."
